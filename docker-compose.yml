services:
  evereasy-server:
    build: .
    container_name: evereasy-server
    restart: unless-stopped
    ports:
      # 宿主机 8787 → 容器 8787；无域名无 HTTPS 时用 http://服务器IP:8787 访问
      - "8787:8787"
    depends_on:
      - asr
    environment:
      - PORT=8787
      - EVEREASY_DB=/app/data/evereasy.db
      # ── AI 官方通道（全代理，默认走智谱 GLM）：Key 不写在这里！写到同目录的 .env 文件里（一行）：
      #    echo 'GLM_API_KEY=你的智谱key' > .env
      #    .env 已被 .gitignore 排除, 永远不会进入 git/公开仓库 ──
      - GLM_API_KEY=${GLM_API_KEY:-}
      # 兼容旧名：若只配了 OPENROUTER_API_KEY 仍可生效（GLM_API_KEY 优先）
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # 可选：唯一允许调用的模型名（付费 glm-4-flash）
      # - GLM_MODEL=glm-4-flash
      # 可选：上游地址（默认 https://open.bigmodel.cn/api/paas/v4）
      # - GLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4
      # ASR 内部转发令牌（Node→FunASR 容器；App 端走同步登录态，不接触此值）
      - ASR_TOKEN=${ASR_TOKEN:-evereasy-asr-v1}
      # CI 推送 APK 鉴权 key（留空则禁用推送接口）
      - PUBLISH_TOKEN=${PUBLISH_TOKEN:-}
      # ── 管理后台 http://IP:PORT/console ──
      # 默认关闭：不配 ADMIN_PASSWORD 时页面显示"未启用"、接口全 503（不存在默认口令）
      # 开启方式（写进同目录 .env，勿写在本文件里）：
      #   echo 'ADMIN_PASSWORD=你的强口令' >> .env
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 可选但强烈建议：来源 IP 白名单（逗号分隔）。当前无 HTTPS，口令明文过公网，
      # 只从固定 IP 访问能显著降低风险；留空=不限制
      - ADMIN_ALLOW_IPS=${ADMIN_ALLOW_IPS:-}
    volumes:
      # 持久化数据库文件到宿主机 ./data（想弃用/迁移直接拷走这个目录即可）
      - ./data:/app/data
      # CI 自动推送的最新 APK + 更新清单（GitHub Actions scp 到此目录）
      - /srv/evereasy-download:/app/data/download

  # 中文语音识别（Vosk 小模型，Kaldi C++ 推理，无 torch/onnxruntime）
  # 模型已在构建期烘焙进镜像（~42MB），运行时零下载、离线可用；内存峰值约 200MB。
  # 仅 compose 内网，不经宿主端口。1核1G 机器免 swap 即可运行。
  asr:
    build: ./asr
    container_name: evereasy-asr
    restart: unless-stopped
    environment:
      - ASR_TOKEN=${ASR_TOKEN:-evereasy-asr-v1}
    deploy:
      resources:
        limits:
          memory: 500M

  # 每 10 分钟从公开发布仓拉取最新 APK 到本机分发目录（拉模式：
  # 服务器只出站请求，无需任何凭据；仓库转私有时在 .env 配 GH_RELEASE_TOKEN）
  release-sync:
    image: alpine:3.20
    container_name: evereasy-release-sync
    restart: unless-stopped
    depends_on:
      - evereasy-server
    environment:
      - GH_RELEASE_TOKEN=${GH_RELEASE_TOKEN:-}
      - GH_REPO=dog-kun/evereasy-download
      - OUT_DIR=/out
      - PUBLIC_BASE=http://202.189.23.245:42363
    volumes:
      - ./scripts/sync-release.sh:/sync.sh:ro
      - /srv/evereasy-download:/out
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
             while true; do sh /sync.sh; sleep 600; done"
