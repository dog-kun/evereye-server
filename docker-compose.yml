services:
  evereasy-server:
    build: .
    container_name: evereasy-server
    restart: unless-stopped
    ports:
      # 宿主机 8787 → 容器 8787；无域名无 HTTPS 时用 http://服务器IP:8787 访问
      - "8787:8787"
    environment:
      - PORT=8787
      - EVEREASY_DB=/app/data/evereasy.db
      # ── AI 官方通道（全代理）：Key 不写在这里！写到同目录的 .env 文件里（一行）：
      #    echo 'OPENROUTER_API_KEY=sk-or-v1-xxx' > .env
      #    .env 已被 .gitignore 排除,永远不会进入 git/公开仓库 ──
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # 可选：唯一允许调用的模型名（默认 stealth/ox-alpha）
      # - OXALPHA_MODEL=stealth/ox-alpha
    volumes:
      # 持久化数据库文件到宿主机 ./data（想弃用/迁移直接拷走这个目录即可）
      - ./data:/app/data
